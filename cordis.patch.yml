# dsh-plugin-screen-recorder — capa bundle de DSH.
# Inserta una fila @deepseek-ai/dsh-mcp-client que lanza el servidor como "screen".
# Tools resultantes: mcp__screen__* (ver README).
- insert:
    - id: mcp-screen-recorder
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: screen
        transport: stdio
        command: !!js process.execPath
        args:
          - !!js "(process.env.DSH_HOME && process.env.DSH_HOME.trim() !== '' ? process.env.DSH_HOME : (process.env.USERPROFILE || process.env.HOME || '') + '/.dsh') + '/plugins/screen-recorder/server.mjs'"
        env:
          ELECTRON_RUN_AS_NODE: '1'
        failOnStartupError: false
        toolCallTimeoutMs: 60000
